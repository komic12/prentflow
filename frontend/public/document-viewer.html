<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrintFlow Document Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/all.min.css" />
</head>

<body class="bg-slate-100 min-h-screen">
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3"><i class="fas fa-file-pdf text-xl"></i><span class="font-bold">PrintFlow Document Viewer</span></div>
            <a href="index.html" class="text-slate-200 hover:text-white text-sm">Back to home</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 grid gap-6 lg:grid-cols-[320px_1fr]">
        <section class="space-y-4">
            <div class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
                <h2 class="text-lg font-semibold text-slate-900">Document details</h2>
                <p class="text-sm text-slate-600 mt-2" id="document-name">Loading...</p>
                <div class="mt-4 grid grid-cols-2 gap-3 text-sm text-slate-700">
                    <div><span class="font-semibold" id="doc-pages">0</span><br/>Total pages</div>
                    <div><span class="font-semibold" id="doc-status">—</span><br/>Status</div>
                </div>
            </div>
            <div class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-semibold text-slate-900">Search pages</h3>
                    <span class="text-xs text-slate-400">Filter by text</span>
                </div>
                <input id="search-input" type="search" placeholder="Search within pages" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm focus:border-blue-500 focus:outline-none" />
            </div>
            <div class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
                <h3 class="font-semibold text-slate-900 mb-3">Selection</h3>
                <p class="text-sm text-slate-600" id="selection-summary">No pages selected.</p>
                <div class="grid grid-cols-2 gap-3 mt-4">
                    <button id="select-all-btn" class="rounded-2xl bg-blue-600 text-white px-4 py-3 text-sm font-semibold hover:bg-blue-700">Select all</button>
                    <button id="clear-selection-btn" class="rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 hover:border-blue-400">Clear</button>
                </div>
            </div>
            <div class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
                <h3 class="font-semibold text-slate-900 mb-3">Actions</h3>
                <button id="extract-pages-btn" class="w-full rounded-2xl bg-emerald-600 text-white px-4 py-3 text-sm font-semibold hover:bg-emerald-700">Extract Selected Pages</button>
                <button id="submit-pages-btn" class="mt-3 w-full rounded-2xl bg-blue-600 text-white px-4 py-3 text-sm font-semibold hover:bg-blue-700">Submit to Cyber Owner</button>
            </div>
        </section>

        <section class="space-y-6">
            <div class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-slate-900">Page thumbnails</h2>
                    <span class="text-sm text-slate-500" id="visible-count">0 shown</span>
                </div>
                <div id="page-grid" class="grid grid-cols-3 gap-3"></div>
            </div>

            <div class="rounded-3xl border border-slate-200 bg-white p-4 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-slate-900">Document viewer</h2>
                    <div class="flex items-center gap-2 text-sm text-slate-500">
                        <button id="prev-page-btn" class="rounded-full border border-slate-200 px-3 py-2 hover:border-blue-400">Prev</button>
                        <button id="next-page-btn" class="rounded-full border border-slate-200 px-3 py-2 hover:border-blue-400">Next</button>
                    </div>
                </div>
                <div class="h-[720px] overflow-hidden rounded-3xl border border-slate-200 bg-slate-100">
                    <iframe id="document-frame" class="h-full w-full" title="Document preview"></iframe>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/document-viewer.js"></script>
</body>

</html>
