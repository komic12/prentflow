<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrintFlow – Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/all.min.css" />
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-7">
        <h1 class="text-2xl font-bold text-slate-800">Create a new password</h1>
        <p class="text-sm text-slate-500 mt-2">Choose a strong password for your PrintFlow account.</p>
        <div class="mt-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">New Password</label>
                <input id="new-password" type="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Confirm Password</label>
                <input id="confirm-password" type="password" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <button onclick="submitReset()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition">Update Password</button>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        async function submitReset() {
            const password = document.getElementById('new-password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            if (!token) return alert('Reset token is missing.');
            try {
                await API.resetPassword(token, password, confirmPassword);
                alert('Password updated successfully.');
                window.location.href = 'index.html';
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>

</html>
